<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOFY — Monitor de Planta</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #08130C;
  --surface:  #0E1F14;
  --surface2: #132818;
  --border:   rgba(34,197,94,0.12);
  --green:    #22C55E;
  --green2:   #16A34A;
  --cyan:     #06B6D4;
  --amber:    #F59E0B;
  --yellow:   #EAB308;
  --red:      #EF4444;
  --text:     #D1FAE5;
  --muted:    #6EE7B7;
  --dim:      #1F2D23;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding: 28px 24px;
  position: relative;
  overflow-x: hidden;
}

/* background grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.page { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.logo { display: flex; align-items: center; gap: 12px; }

.logo svg { width: 42px; height: 42px; }

.logo-name {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 6px;
  color: var(--green);
  line-height: 1;
}

.logo-sub {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 3px;
}

.status-block { text-align: right; }

.status-line {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  margin-bottom: 5px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
}

.dot.online {
  background: var(--green);
  animation: heartbeat 2s ease-in-out infinite;
}

@keyframes heartbeat {
  0%,100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.4); opacity: 0.7; }
}

.status-text { font-size: 12px; color: var(--muted); }

.last-ts {
  font-size: 11px;
  color: #2D4A35;
  font-family: 'Courier New', monospace;
}

/* ── GAUGES ── */
.gauges {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px 16px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.4s;
}

.card:hover { border-color: rgba(34,197,94,0.28); }

.card-accent {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 18px 18px 0 0;
}

.card.temp  .card-accent { background: var(--amber); }
.card.soil  .card-accent { background: var(--cyan); }
.card.light .card-accent { background: var(--yellow); }

.card-label {
  font-size: 10px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.card-label svg { width: 14px; height: 14px; }

/* SVG gauge ring */
.gauge-wrap {
  position: relative;
  width: 140px;
  height: 140px;
}

.gauge-wrap svg {
  transform: rotate(-90deg);
}

.ring-bg {
  fill: none;
  stroke: var(--dim);
  stroke-width: 9;
}

.ring-fill {
  fill: none;
  stroke-width: 9;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.1s cubic-bezier(0.4, 0, 0.2, 1);
}

.ring-fill.temp  { stroke: var(--amber); }
.ring-fill.soil  { stroke: var(--cyan); }
.ring-fill.light { stroke: var(--yellow); }

.gauge-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}

.gauge-num {
  font-size: 26px;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  color: var(--text);
  line-height: 1;
  transition: color 0.5s;
}

.gauge-unit {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

/* ── BOTTOM ROW ── */
.bottom {
  display: grid;
  grid-template-columns: 1fr 120px 1fr;
  gap: 16px;
  align-items: start;
}

/* Mini stat rows */
.stats { display: flex; flex-direction: column; gap: 10px; }

.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.stat-k {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}

.stat-v {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.stat-v.ok   { color: var(--green); }
.stat-v.warn { color: var(--amber); }
.stat-v.err  { color: var(--red); }

/* ── PLANT ── */
#plant-svg {
  display: block;
  margin: 0 auto;
  filter: drop-shadow(0 4px 12px rgba(34,197,94,0.25));
}

.leaf { transition: all 0.8s ease; }
.l1 { animation: sway1 3.5s ease-in-out infinite; transform-origin: 50px 108px; }
.l2 { animation: sway2 3.5s ease-in-out infinite; transform-origin: 50px 108px; }
.l3 { animation: sway3 2.8s ease-in-out infinite; transform-origin: 50px 90px; }
.l4 { animation: sway4 4s ease-in-out infinite; transform-origin: 50px 75px; }

@keyframes sway1 { 0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)} }
@keyframes sway2 { 0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg)} }
@keyframes sway3 { 0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)} }
@keyframes sway4 { 0%,100%{transform:rotate(1deg)}50%{transform:rotate(-2deg)} }

/* ── ESTADO ── */
.estado-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
}

.estado-title {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  text-align: center;
}

.estado-badge {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 4px;
  text-align: center;
  padding: 10px 8px;
  border-radius: 8px;
  transition: all 0.6s ease;
}

.estado-badge.OPTIMO {
  color: var(--green);
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.2);
}

.estado-badge.MEDIO {
  color: var(--amber);
  background: rgba(245,158,11,0.08);
  border: 1px solid rgba(245,158,11,0.2);
}

.estado-badge.SECO {
  color: var(--red);
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  animation: alert 1.5s ease-in-out infinite;
}

@keyframes alert {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.6; }
}

.estado-desc {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 8px;
}

/* ── PARTICLES ── */
.p {
  position: fixed;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  pointer-events: none;
  animation: rise 10s linear infinite;
}

@keyframes rise {
  0%   { transform: translateY(100vh); opacity: 0; }
  8%   { opacity: 0.4; }
  92%  { opacity: 0.15; }
  100% { transform: translateY(-60px) translateX(20px); opacity: 0; }
}

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .gauges  { grid-template-columns: 1fr; }
  .bottom  { grid-template-columns: 1fr; }
  .bottom .plant-col { order: -1; }
}
</style>
</head>
<body>

<!-- Particles -->
<div class="p" style="left:8%;background:#22C55E;animation-delay:0s;"></div>
<div class="p" style="left:22%;background:#06B6D4;animation-delay:2.5s;"></div>
<div class="p" style="left:45%;background:#22C55E;animation-delay:5s;"></div>
<div class="p" style="left:68%;background:#4ADE80;animation-delay:1.2s;"></div>
<div class="p" style="left:85%;background:#06B6D4;animation-delay:7s;"></div>
<div class="p" style="left:55%;background:#22C55E;animation-delay:3.8s;"></div>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 42 42" fill="none">
        <circle cx="21" cy="21" r="20" stroke="#22C55E" stroke-width="1.5"/>
        <path d="M21 32 C21 26 21 20 21 16 C15 12 12 6 12 6 C17 9 20 16 21 16 C22 16 25 9 30 6 C30 6 27 12 21 16" fill="#22C55E"/>
        <ellipse cx="21" cy="33" rx="6" ry="2.5" fill="#16A34A"/>
      </svg>
      <div>
        <div class="logo-name">ECOFY</div>
        <div class="logo-sub">Monitor de Planta en Tiempo Real</div>
      </div>
    </div>
    <div class="status-block">
      <div class="status-line">
        <div class="dot" id="dot"></div>
        <span class="status-text" id="statusTxt">Conectando a Firebase...</span>
      </div>
      <div class="last-ts" id="lastTs">—</div>
    </div>
  </div>

  <!-- GAUGES -->
  <div class="gauges">

    <!-- TEMPERATURA -->
    <div class="card temp">
      <div class="card-accent"></div>
      <div class="card-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
        </svg>
        Temperatura
      </div>
      <div class="gauge-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="ring-bg"   cx="70" cy="70" r="56" stroke-dasharray="351.9"/>
          <circle class="ring-fill temp" id="rT" cx="70" cy="70" r="56"
            stroke-dasharray="351.9" stroke-dashoffset="351.9"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-num" id="vT">—</div>
          <div class="gauge-unit">°C</div>
        </div>
      </div>
    </div>

    <!-- HUMEDAD SUELO -->
    <div class="card soil">
      <div class="card-accent"></div>
      <div class="card-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
        Humedad Suelo
      </div>
      <div class="gauge-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="ring-bg"    cx="70" cy="70" r="56" stroke-dasharray="351.9"/>
          <circle class="ring-fill soil" id="rS" cx="70" cy="70" r="56"
            stroke-dasharray="351.9" stroke-dashoffset="351.9"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-num" id="vS">—</div>
          <div class="gauge-unit">%</div>
        </div>
      </div>
    </div>

    <!-- LUZ -->
    <div class="card light">
      <div class="card-accent"></div>
      <div class="card-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        Luz
      </div>
      <div class="gauge-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="ring-bg"     cx="70" cy="70" r="56" stroke-dasharray="351.9"/>
          <circle class="ring-fill light" id="rL" cx="70" cy="70" r="56"
            stroke-dasharray="351.9" stroke-dashoffset="351.9"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-num" id="vL">—</div>
          <div class="gauge-unit">%</div>
        </div>
      </div>
    </div>

  </div>

  <!-- BOTTOM ROW -->
  <div class="bottom">

    <!-- Stats left -->
    <div class="stats">
      <div class="stat">
        <span class="stat-k">Ping</span>
        <span class="stat-v ok" id="vPing">—</span>
      </div>
      <div class="stat">
        <span class="stat-k">Humedad Aire</span>
        <span class="stat-v" id="vAir">—</span>
      </div>
      <div class="stat">
        <span class="stat-k">Fecha / Hora</span>
        <span class="stat-v" id="vFecha" style="font-size:11px">—</span>
      </div>
    </div>

    <!-- Plant center -->
    <div class="plant-col">
      <svg id="plant-svg" width="100" height="150" viewBox="0 0 100 150">
        <!-- Maceta -->
        <rect x="32" y="120" width="36" height="22" rx="3" fill="#7C2D2D"/>
        <rect x="27" y="116" width="46" height="9" rx="2" fill="#9B3838"/>
        <!-- Tierra -->
        <ellipse cx="50" cy="117" rx="23" ry="5" fill="#3B1F1A"/>
        <!-- Tallo -->
        <line x1="50" y1="116" x2="50" y2="70" stroke="#22C55E" stroke-width="3.5" stroke-linecap="round" id="stem"/>
        <!-- Hojas -->
        <ellipse class="leaf l1" id="ll" cx="34" cy="96" rx="16" ry="9" fill="#16A34A"/>
        <ellipse class="leaf l2" id="lr" cx="66" cy="96" rx="16" ry="9" fill="#22C55E"/>
        <ellipse class="leaf l3" id="lm" cx="38" cy="80" rx="13" ry="7" fill="#15803D"/>
        <ellipse class="leaf l4" id="lt" cx="50" cy="65" rx="10" ry="16" fill="#4ADE80"/>
        <!-- Flor / fruto -->
        <circle id="flower" cx="50" cy="56" r="7" fill="#86EFAC" opacity="0.9"/>
        <circle cx="50" cy="56" r="3" fill="#22C55E" opacity="0.8"/>
      </svg>
    </div>

    <!-- Estado right -->
    <div>
      <div class="estado-card">
        <div class="estado-title">Estado de la Planta</div>
        <div class="estado-badge OPTIMO" id="vEstado">—</div>
        <div class="estado-desc" id="descEstado">Esperando datos...</div>
      </div>
    </div>

  </div>

</div>

<script>
/* ═══════════════════════════════════════════
   CONFIGURA TU URL DE FIREBASE AQUÍ
   ═══════════════════════════════════════════ */
const FIREBASE_URL =
  'https://plantasfirebase-8290b-default-rtdb.firebaseio.com/lectura_sensores.json';

/* ═══════════════════════════════════════════ */

const CIRC = 351.9;

function setRing(id, pct) {
  const el = document.getElementById(id);
  const offset = CIRC * (1 - Math.max(0, Math.min(100, pct)) / 100);
  el.style.strokeDashoffset = offset;
}

function animNum(id, target, decimals) {
  const el = document.getElementById(id);
  const from = parseFloat(el.textContent) || 0;
  let start = null;
  const dur = 900;
  function step(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    const v = from + (target - from) * ease;
    el.textContent = decimals ? v.toFixed(decimals) : Math.round(v);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = decimals ? target.toFixed(decimals) : Math.round(target);
  }
  requestAnimationFrame(step);
}

function updatePlant(soil) {
  const flower = document.getElementById('flower');
  const ll = document.getElementById('ll');
  const lr = document.getElementById('lr');
  const lm = document.getElementById('lm');
  if (soil > 60) {
    flower.setAttribute('fill', '#86EFAC'); flower.setAttribute('r', '7');
    ll.setAttribute('fill', '#16A34A'); lr.setAttribute('fill', '#22C55E');
    lm.setAttribute('fill', '#15803D');
    ll.setAttribute('transform', ''); lr.setAttribute('transform', '');
  } else if (soil > 35) {
    flower.setAttribute('fill', '#FCD34D'); flower.setAttribute('r', '5');
    ll.setAttribute('fill', '#4D7C0F'); lr.setAttribute('fill', '#65A30D');
    lm.setAttribute('fill', '#3F6212');
    ll.setAttribute('transform', ''); lr.setAttribute('transform', '');
  } else {
    flower.setAttribute('fill', '#FCA5A5'); flower.setAttribute('r', '4');
    ll.setAttribute('fill', '#7C2D12'); lr.setAttribute('fill', '#9A3412');
    lm.setAttribute('fill', '#78350F');
    ll.setAttribute('transform', 'rotate(20, 50, 116)');
    lr.setAttribute('transform', 'rotate(-20, 50, 116)');
  }
}

function setEstado(s, soil) {
  const el = document.getElementById('vEstado');
  const desc = document.getElementById('descEstado');
  const estado = s || (soil > 60 ? 'OPTIMO' : soil > 35 ? 'MEDIO' : 'SECO');
  el.className = 'estado-badge ' + estado;
  el.textContent = estado;
  const msgs = {
    OPTIMO: 'Planta en condiciones ideales',
    MEDIO:  'Requiere algo de agua pronto',
    SECO:   'Regar inmediatamente'
  };
  desc.textContent = msgs[estado] || '';
}

async function fetchData() {
  try {
    const res = await fetch(FIREBASE_URL);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    if (!d) throw new Error('empty');

    document.getElementById('dot').className = 'dot online';
    document.getElementById('statusTxt').textContent = 'Firebase conectado';
    document.getElementById('lastTs').textContent =
      'Actualizado: ' + new Date().toLocaleTimeString('es-EC');

    const temp  = d.temperatura_C    ?? 0;
    const soil  = d.humedadSuelo_PCT ?? 0;
    const light = d.luz_PCT          ?? 0;
    const air   = d.humedad_PCT      ?? 0;

    animNum('vT', temp, 1);
    animNum('vS', soil, 0);
    animNum('vL', light, 0);

    setRing('rT', (temp / 50) * 100);
    setRing('rS', soil);
    setRing('rL', light);

    document.getElementById('vPing').textContent  = d.ping ?? '—';
    document.getElementById('vAir').textContent   = air > 0 ? air.toFixed(1) + ' %' : 'N/A';
    document.getElementById('vFecha').textContent = d.fechaHora ?? '—';

    setEstado(d.estado, soil);
    updatePlant(soil);

  } catch (e) {
    document.getElementById('dot').className = 'dot';
    document.getElementById('statusTxt').textContent = 'Sin conexión con Firebase';
    console.error('Firebase error:', e);
  }
}

fetchData();
setInterval(fetchData, 5000);
</script>
</body>
</html>
